[workspace]
members = ["apps/api", "libs/shared", "libs/infrastructure", "libs/domain", "libs/application"]
resolver = "3"


[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# 1. Web Framework & Async Runtime
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
tokio = { version = "1.53.2", features = ["full"] }
tower = { version = "0.5.3", features = ["util", "timeout"] }
tower-http = { version = "0.7.1", features = [
    "cors",
    "trace",
    "compression-full","request-id", "sensitive-headers"
] }

# 2. Database (PostgreSQL không dùng ORM)
# Hỗ trợ compile-time SQL check, UUIDv7 và JSONB
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-native-tls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
] }

# 3. Serialization & Validation
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
validator = { version = "0.21.0", features = ["derive"] }
reqwest = { version = "0.13.5", features = ["json", "query"] }

# 4. Utilities
uuid = { version = "1.27.0", features = ["v7", "serde", "fast-rng"] }
chrono = { version = "0.4.45", features = ["serde"] }
time =  "0.3.55"
dotenvy = "0.15.7"
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2.5"

# 5. Cache
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager"] }
moka = { version = "0.12.16", features = ["future"] }
deadpool = "0.13.1"

# 6. Security (JWT & Password Hashing)
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
argon2 = { version = "0.6.0", features = ["getrandom"] }
rand = { version = "0.10.3", features = ["std"] }
sha2 = "0.11.0"
hex = "0.4.3"
base64 = "0.23.1"
ctutils = "0.4.3"


# 7. Messaging & Email (RabbitMQ + Gmail SMTP)
lapin = "4.12.0"
futures-lite = "2.6.1"
lettre = { version = "0.11.23", default-features = false, features = [
    "tokio1-rustls-tls",
    "smtp-transport",
    "builder",
] }

# Cloudfare R2 storage
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.152.0"


# my crate
shared = { path = "libs/shared" }


[profile.release]
# Tối ưu hóa file binary cho Production
opt-level = 3     # Tối ưu hóa tốc độ tối đa
lto = true        # Link Time Optimization (giảm kích thước file build)
codegen-units = 1 # Giúp compiler tối ưu hóa tốt hơn
# panic = "abort"   # Giảm kích thước file bằng cách bỏ qua stack unwinding
strip = true      # Loại bỏ các ký tự debug để file cực nhẹ